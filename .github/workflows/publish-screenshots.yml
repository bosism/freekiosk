name: Publish screenshots

# Copies the ESP710-screenshots artifact of an "Android APK" run into docs/screenshots on
# this branch, so the captures can be viewed on GitHub (artifacts only download as a zip).
# Runs on manual dispatch, or on a push that touches this file (which uses DEFAULT_RUN_ID).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the Android APK workflow that produced ESP710-screenshots
        required: true
  push:
    paths:
      - .github/workflows/publish-screenshots.yml

env:
  DEFAULT_RUN_ID: "35495612900"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ESP710-screenshots
          path: docs/screenshots
          run-id: ${{ inputs.run_id || env.DEFAULT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: emulator screenshots from Android APK run ${{ inputs.run_id || env.DEFAULT_RUN_ID }}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
