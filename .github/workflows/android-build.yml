name: Android APK

# Builds the ESP710-branded release APK on GitHub's runners (the GitHub-release variant:
# self-update on, accessibility service kept, signed with the debug keystore unless a
# keystore.properties is provided). The APK is attached to the run as an artifact.
on:
  push:
    branches:
      - 'claude/**'
      - 'esp710**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies (applies patch-package patches)
        run: npm ci --no-audit --no-fund

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Gradle properties
        run: cp android/gradle.properties.template android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ESP710-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ESP710-apk
          path: dist/*.apk
          if-no-files-found: error
