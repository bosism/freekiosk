name: Android APK

# Builds the ESP710-branded release APK on GitHub's runners (the GitHub-release variant:
# self-update on, accessibility service kept, signed with the debug keystore unless a
# keystore.properties is provided). The APK is attached to the run as an artifact, and a
# push of an esp710-v* tag additionally publishes it as a GitHub release.
on:
  push:
    branches:
      - 'claude/**'
      - 'esp710**'
    tags:
      - 'esp710-v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies (applies patch-package patches)
        run: npm ci --no-audit --no-fund

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Gradle properties
        run: cp android/gradle.properties.template android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ESP710-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ESP710-apk
          path: dist/*.apk
          if-no-files-found: error

  screenshots:
    # Branch pushes only: the job commits back to the pushed branch.
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ESP710-apk
          path: dist

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app in an emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: 7in WSVGA (Tablet)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1920x1200
          disable-animations: true
          script: APK=$(ls dist/*.apk | head -1) OUT=screenshots bash scripts/ci-screenshots.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ESP710-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Commit screenshots to docs/screenshots
        run: |
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: emulator screenshots for ${GITHUB_SHA::7}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Publishes a GitHub release with the APK. Two ways in:
  #  - push an esp710-v* tag, or
  #  - put the tag name in .github/esp710-release.txt on the branch (this environment
  #    cannot push tags). The job creates the tag at the built commit and skips when a
  #    release for that tag already exists, so it is safe on every push.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -s .github/esp710-release.txt ]; then
            tag=$(tr -d '[:space:]' < .github/esp710-release.txt)
          else
            echo "no release requested"; exit 0
          fi
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release $tag already exists, nothing to do"; exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          name: ESP710-apk
          path: dist

      - name: Publish GitHub release with the APK
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          apk=$(ls dist/*.apk | head -1)
          (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          sed "s|__TAG__|${tag}|g; s|__SHA__|${GITHUB_SHA}|g; s|__APK__|$(basename "$apk")|g; s|__SHA256__|$(cut -d' ' -f1 "${apk}.sha256")|g" \
            .github/release-notes-esp710.md > /tmp/notes.md
          gh release create "$tag" "$apk" "${apk}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ESP710 ${tag#esp710-}" \
            --notes-file /tmp/notes.md
